<!DOCTYPE html>
<html>

<head>

    <title>User Login</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="container">

    <h2>User Login</h2>

    <form action="/loginUser" method="post">

        <input type="email"
               name="email"
               placeholder="Enter Email">

        <input type="password"
               name="password"
               placeholder="Enter Password">

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
